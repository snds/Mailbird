[package]
name = "pim-core"
version = "0.1.0"
description = "Shared mail, calendar, contacts, and notes core used by every shell"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["net"]
# Network adapters (IMAP sync, SMTP send). Off = store + logic only, which is
# what the unit tests and a future WASM/web build need.
net = [
  "dep:async-imap",
  "dep:futures",
  "dep:lettre",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:webpki-roots",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
uuid = { version = "1.18", features = ["v4"] }
# bundled = one SQLite everywhere (incl. FTS5), no system library differences.
rusqlite = { version = "0.40", features = ["bundled"] }
mail-parser = "0.11"

async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"], optional = true }
futures = { version = "0.3", optional = true }
# ring (not aws-lc-rs) keeps Windows/Android builds free of cmake + nasm.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", features = ["net", "rt", "time", "macros"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
