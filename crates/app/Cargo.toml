[package]
name = "pim-app"
version = "0.1.0"
description = "The app on top of pim-core: commands, background workers, and one dispatcher, shared by the Tauri shell and the web gateway"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pim-core = { path = "../core" }
# The shared identity: the locked-notes key is wrapped under it (ADR-0051).
# Extracted to its own repository (ADR-0049); pinned by commit, bumped on purpose.
ecosystem-identity = { git = "https://github.com/snds/ecosystem-identity", rev = "96434d1de190164d7635302ce851fc0817000649" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# This device's id on a push relay (ADR-0015).
uuid = { version = "1.18", features = ["v4"] }
# Note images saved out of an export (ADR-0044).
base64 = "0.22"

[dev-dependencies]
# Tests read the identity back, and use a KDF floor a debug build can afford.
ecosystem-identity = { git = "https://github.com/snds/ecosystem-identity", rev = "96434d1de190164d7635302ce851fc0817000649", features = ["insecure-test-kdf"] }
