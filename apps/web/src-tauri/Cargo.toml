[package]
name = "mailbird-shell"
version = "0.1.0"
description = "Tauri 2 shell (desktop + mobile) for the web app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "mailbird_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
# Opens saved attachments with the default app (MIT OR Apache-2.0).
tauri-plugin-opener = "2"
pim-core = { path = "../../../crates/core" }
tokio = { version = "1", features = ["sync", "time"] }
# OS keychain: macOS/iOS Keychain, Windows Credential Manager, Secret Service on Linux.
# keyring 4 adds an Android store; move to it with the mobile spike (ADR-0002).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-notification = "=2.4.0"
# This device's id on a push relay (ADR-0015).
uuid = { version = "1.18", features = ["v4"] }
