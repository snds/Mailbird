[package]
name = "vale-gateway"
version = "0.1.0"
description = "Self-hosted web gateway: the Vale web app with real accounts, on the same core as the desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pim-core = { path = "../../crates/core" }
pim-app = { path = "../../crates/app" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Sealing stored secrets (AES-256-GCM) and session tokens.
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
log = "0.4"
# Update checks (ADR-0077): the shared kit's rules, the same ones the desktop
# app follows (snds/app-updates, Apache-2.0, pinned by tag; no `tauri`
# feature), the version order, and one https GET with the core's TLS setup.
snds-app-updates = { git = "https://github.com/snds/app-updates", tag = "v0.1.0" }
# One-click Update and Reload (ADR-0078): the host helper's client, signed
# requests over its private network, signed replies checked. Client and
# protocol only (`default-features = false`: no allow-list, no Docker code).
# Pinned by commit until the helper is tagged.
snds-app-updates-host-helper = { git = "https://github.com/snds/app-updates", rev = "c0ff0bfcb6eab8aa8287f33739ff149016d1e4bf", default-features = false }
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream"] }
