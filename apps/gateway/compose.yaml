# Vale web gateway on a personal server. See README.md.
#   cp .env.example .env   # fill in GATEWAY_PASSWORD and GATEWAY_KEY
#   docker compose up -d            # the published image (every push to main)
#   docker compose up -d --build    # or build it from this checkout instead
# Updating to the newest published image (Settings → Gateway updates says
# when one is out, ADR-0077): `docker compose pull && docker compose up -d`.
# With the host helper installed (snds/app-updates host-helper/README.md),
# Settings' Update and Reload do it instead (ADR-0078); the helper's
# compose.override.yaml, beside this file, adds its network and
# host-helper.env. Nothing here changes for it.
services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    image: ghcr.io/snds/vale-gateway:main
    restart: unless-stopped
    env_file: .env
    volumes:
      - gateway-data:/data
    # Listen on this machine only; put Caddy, nginx, or a tunnel in front for https.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  gateway-data:
